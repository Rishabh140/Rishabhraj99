name: Build Android APK and Deploy iPhone Web App

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Project & Add Packages
        run: |
          flutter create --org com.family --project-name family_meal_planner .
          flutter pub add "flutter_local_notifications:^17.2.4" timezone intl url_launcher shared_preferences http

      - name: Configure Android Build
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.family.family_meal_planner"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.family.family_meal_planner"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 10
                  versionName = "1.0.9"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure Android Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>

              <application
                  android:label="Family Meal Planner"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                      android:exported="true" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Application with Real-Time Cloud Sync
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:intl/intl.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;

          const String firebaseUrl = "https://family-meal-planner-75ad2-default-rtdb.asia-southeast1.firebasedatabase.app";

          final FlutterLocalNotificationsPlugin localNotifs = FlutterLocalNotificationsPlugin();

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const FamilyMealPlannerApp());
          }

          class FamilyMealPlannerApp extends StatelessWidget {
            const FamilyMealPlannerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Family Meal Planner',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.indigo,
                ),
                home: const MainDashboard(),
              );
            }
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            DateTime selectedDate = DateTime.now();
            final List<String> meals = ['Breakfast', 'Tiffin', 'Lunch', 'Dinner'];

            final List<String> memberNames = ['Ashish', 'Sanita', 'Rishabh', 'Swati'];
            final Map<String, String> memberAvatars = {
              'Ashish': '👨',
              'Sanita': '👩',
              'Rishabh': '👨',
              'Swati': '👩',
            };

            final Map<String, String> memberPins = {
              'Ashish': '1111',
              'Sanita': '2222',
              'Rishabh': '3333',
              'Swati': '4444',
            };

            String activeUser = 'Rishabh';
            Map<String, Map<String, bool>> defaults = {
              'Ashish': {'Breakfast': true, 'Tiffin': true, 'Lunch': true, 'Dinner': true},
              'Sanita': {'Breakfast': true, 'Tiffin': true, 'Lunch': true, 'Dinner': true},
              'Rishabh': {'Breakfast': true, 'Tiffin': true, 'Lunch': true, 'Dinner': false},
              'Swati': {'Breakfast': true, 'Tiffin': true, 'Lunch': true, 'Dinner': true},
            };

            Map<String, dynamic> explicitData = {};
            String? latestAlertMessage;
            String? lastSeenAlert;
            Timer? syncTimer;

            @override
            void initState() {
              super.initState();
              _loadPersistedData();
              _initNotificationsSafely();
              _startCloudSyncPolling();
            }

            @override
            void dispose() {
              syncTimer?.cancel();
              super.dispose();
            }

            void _startCloudSyncPolling() {
              syncTimer = Timer.periodic(const Duration(seconds: 4), (_) {
                _pullFromCloud();
              });
              _pullFromCloud();
            }

            Future<void> _pullFromCloud() async {
              try {
                final url = Uri.parse("$firebaseUrl/meals.json");
                final resp = await http.get(url);
                if (resp.statusCode == 200 && resp.body != "null") {
                  final Map<String, dynamic> cloudData = jsonDecode(resp.body);
                  if (mounted) {
                    setState(() {
                      explicitData = cloudData;
                    });
                  }
                }

                final alertUrl = Uri.parse("$firebaseUrl/latest_alert.json");
                final alertResp = await http.get(alertUrl);
                if (alertResp.statusCode == 200 && alertResp.body != "null") {
                  final String alertMsg = jsonDecode(alertResp.body);
                  if (alertMsg != lastSeenAlert) {
                    lastSeenAlert = alertMsg;
                    if (mounted) {
                      setState(() {
                        latestAlertMessage = alertMsg;
                      });
                    }
                    if (!alertMsg.startsWith(activeUser)) {
                      _dispatchPushNotification(alertMsg);
                    }
                  }
                }
              } catch (_) {}
            }

            Future<void> _pushToCloud(String message) async {
              try {
                final url = Uri.parse("$firebaseUrl/meals.json");
                await http.put(url, body: jsonEncode(explicitData));

                final alertUrl = Uri.parse("$firebaseUrl/latest_alert.json");
                await http.put(alertUrl, body: jsonEncode(message));
              } catch (_) {}
            }

            Future<void> _dispatchPushNotification(String alertText) async {
              try {
                const NotificationDetails notifDetails = NotificationDetails(
                  android: AndroidNotificationDetails(
                    'instant_channel',
                    'Meal Updates',
                    importance: Importance.max,
                    priority: Priority.high,
                  ),
                );
                await localNotifs.show(
                  777,
                  'Family Meal Update',
                  alertText,
                  notifDetails,
                );
              } catch (_) {}
            }

            Future<void> _initNotificationsSafely() async {
              try {
                tz.initializeTimeZones();
                try {
                  tz.setLocalLocation(tz.getLocation('Asia/Kolkata'));
                } catch (_) {}

                const AndroidInitializationSettings androidSettings =
                    AndroidInitializationSettings('@mipmap/ic_launcher');
                const InitializationSettings initSettings =
                    InitializationSettings(android: androidSettings);

                await localNotifs.initialize(initSettings);

                final androidImpl = localNotifs.resolvePlatformSpecificImplementation<
                    AndroidFlutterLocalNotificationsPlugin>();
                if (androidImpl != null) {
                  await androidImpl.requestNotificationsPermission();
                  await androidImpl.requestExactAlarmsPermission();
                }

                await scheduleDailyMealReminders();
              } catch (_) {}
            }

            Future<void> scheduleDailyMealReminders() async {
              const NotificationDetails notifDetails = NotificationDetails(
                android: AndroidNotificationDetails(
                  'meal_reminders_id',
                  'Meal Reminders',
                  channelDescription: 'Daily 8:00 AM and 10:00 PM Meal Alarms',
                  importance: Importance.max,
                  priority: Priority.high,
                ),
              );

              await localNotifs.zonedSchedule(
                101,
                'Breakfast Reminder (8:00 AM)',
                'Confirm if you are eating breakfast today!',
                _nextInstanceOfTime(8, 0),
                notifDetails,
                androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
                uiLocalNotificationDateInterpretation:
                    UILocalNotificationDateInterpretation.absoluteTime,
                matchDateTimeComponents: DateTimeComponents.time,
              );

              await localNotifs.zonedSchedule(
                102,
                'Tiffin Reminder (10:00 PM)',
                'Confirm if you want tiffin packed for tomorrow!',
                _nextInstanceOfTime(22, 0),
                notifDetails,
                androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
                uiLocalNotificationDateInterpretation:
                    UILocalNotificationDateInterpretation.absoluteTime,
                matchDateTimeComponents: DateTimeComponents.time,
              );
            }

            tz.TZDateTime _nextInstanceOfTime(int hour, int minute) {
              final tz.TZDateTime now = tz.TZDateTime.now(tz.local);
              tz.TZDateTime scheduledDate =
                  tz.TZDateTime(tz.local, now.year, now.month, now.day, hour, minute);
              if (scheduledDate.isBefore(now)) {
                scheduledDate = scheduledDate.add(const Duration(days: 1));
              }
              return scheduledDate;
            }

            Future<void> _loadPersistedData() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final savedActiveUser = prefs.getString('saved_active_user');
                final rawExplicit = prefs.getString('saved_explicit');

                setState(() {
                  if (savedActiveUser != null && memberNames.contains(savedActiveUser)) {
                    activeUser = savedActiveUser;
                  }
                  if (rawExplicit != null) {
                    explicitData = jsonDecode(rawExplicit);
                  }
                });
              } catch (_) {}
            }

            Future<void> _persistAll() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('saved_active_user', activeUser);
              await prefs.setString('saved_explicit', jsonEncode(explicitData));
            }

            String get dateKey => DateFormat('yyyy-MM-dd').format(selectedDate);

            bool getEffectiveValue(String member, String meal) {
              if (explicitData.containsKey(dateKey) &&
                  explicitData[dateKey].containsKey(member) &&
                  explicitData[dateKey][member].containsKey(meal)) {
                return explicitData[dateKey][member][meal] as bool;
              }
              return defaults[member]?[meal] ?? false;
            }

            void setSelection(String member, String meal, bool value) async {
              if (member != activeUser) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    backgroundColor: Colors.red.shade800,
                    content: Text("🔒 Locked! You are logged in as $activeUser. You cannot modify $member's choice."),
                  ),
                );
                return;
              }

              final alertMsg = "$member marked $meal as ${value ? 'EATING (YES)' : 'NOT EATING (NO)'}";

              setState(() {
                explicitData.putIfAbsent(dateKey, () => {});
                explicitData[dateKey].putIfAbsent(member, () => {});
                explicitData[dateKey][member][meal] = value;
                latestAlertMessage = alertMsg;
                lastSeenAlert = alertMsg;
              });

              _persistAll();
              _pushToCloud(alertMsg);
              _dispatchPushNotification(alertMsg);
            }

            void _showSwitchUserDialog() {
              final pinController = TextEditingController();
              String targetUser = memberNames.first;

              showDialog(
                context: context,
                builder: (ctx) {
                  return StatefulBuilder(
                    builder: (context, setDialogState) {
                      return AlertDialog(
                        title: const Text('Switch Profile (PIN Protected)'),
                        content: Column(
                          mainAxisSize: dynamic;
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            DropdownButtonFormField<String>(
                              value: targetUser,
                              decoration: const InputDecoration(labelText: 'Select Person', border: OutlineInputBorder()),
                              items: memberNames.map((n) {
                                return DropdownMenuItem(value: n, child: Text("${memberAvatars[n]} $n"));
                              }).toList(),
                              onChanged: (val) {
                                if (val != null) setDialogState(() => targetUser = val);
                              },
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: pinController,
                              keyboardType: TextInputType.number,
                              obscureText: true,
                              decoration: const InputDecoration(
                                labelText: 'Enter 4-Digit PIN',
                                helperText: 'Ashish:1111, Sanita:2222, Rishabh:3333, Swati:4444',
                                border: OutlineInputBorder(),
                              ),
                            ),
                          ],
                        ),
                        actions: [
                          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                          ElevatedButton(
                            onPressed: () {
                              if (pinController.text.trim() == memberPins[targetUser]) {
                                setState(() => activeUser = targetUser);
                                _persistAll();
                                Navigator.pop(ctx);
                              } else {
                                ScaffoldMessenger.of(context).showSnackBar(
                                  const SnackBar(content: Text('Incorrect PIN! Access denied.')),
                                );
                              }
                            },
                            child: const Text('Unlock'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );
            }

            void shareToWhatsApp() async {
              final dateHeader = DateFormat('dd MMMM yyyy').format(selectedDate);
              StringBuffer sb = StringBuffer();
              sb.writeln("🍽️ Family Meal Status — $dateHeader\n");

              for (var meal in meals) {
                var yesList = memberNames.where((m) => getEffectiveValue(m, meal)).toList();
                var noList = memberNames.where((m) => !getEffectiveValue(m, meal)).toList();

                sb.writeln("▶ ${meal.toUpperCase()}:");
                sb.writeln("  ✅ Eating (${yesList.length}): ${yesList.isEmpty ? 'None' : yesList.join(', ')}");
                sb.writel
