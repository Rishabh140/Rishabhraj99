name: Build Family Meal Planner APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Project & Add Packages
        run: |
          flutter create --org com.family --project-name family_meal_planner .
          flutter pub add "flutter_local_notifications:^17.2.4" timezone intl url_launcher shared_preferences

      - name: Configure Android Build
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.family.family_meal_planner"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.family.family_meal_planner"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 5
                  versionName = "1.0.4"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Configure Android Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>

              <application
                  android:label="Family Meal Planner"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                      android:exported="true" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Application with Gender Profiles & Avatars
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;

          final FlutterLocalNotificationsPlugin localNotifs = FlutterLocalNotificationsPlugin();

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const FamilyMealPlannerApp());
          }

          class FamilyMealPlannerApp extends StatelessWidget {
            const FamilyMealPlannerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Family Meal Planner',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.indigo,
                ),
                home: const MainDashboard(),
              );
            }
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            DateTime selectedDate = DateTime.now();
            final List<String> meals = ['Breakfast', 'Tiffin', 'Lunch', 'Dinner'];

            List<String> memberNames = ['Member 1', 'Member 2', 'Member 3', 'Member 4'];
            Map<String, String> memberAvatars = {
              'Member 1': '👨',
              'Member 2': '👩',
              'Member 3': '👦',
              'Member 4': '👧',
            };

            String activeUser = 'Member 1';
            Map<String, Map<String, bool>> defaults = {};
            Map<String, dynamic> explicitData = {};

            @override
            void initState() {
              super.initState();
              _initDefaults();
              _loadPersistedData();
              _initNotificationsSafely();
            }

            void _initDefaults() {
              defaults = {
                for (var name in memberNames)
                  name: {'Breakfast': true, 'Tiffin': true, 'Lunch': true, 'Dinner': false}
              };
            }

            Future<void> _initNotificationsSafely() async {
              try {
                tz.initializeTimeZones();
                try {
                  tz.setLocalLocation(tz.getLocation('Asia/Kolkata'));
                } catch (_) {}

                const AndroidInitializationSettings androidSettings =
                    AndroidInitializationSettings('@mipmap/ic_launcher');
                const InitializationSettings initSettings =
                    InitializationSettings(android: androidSettings);

                await localNotifs.initialize(initSettings);

                final androidImpl = localNotifs.resolvePlatformSpecificImplementation<
                    AndroidFlutterLocalNotificationsPlugin>();
                if (androidImpl != null) {
                  await androidImpl.requestNotificationsPermission();
                  await androidImpl.requestExactAlarmsPermission();
                }

                await scheduleDailyMealReminders();
              } catch (_) {}
            }

            Future<void> scheduleDailyMealReminders() async {
              const NotificationDetails notifDetails = NotificationDetails(
                android: AndroidNotificationDetails(
                  'meal_reminders_id',
                  'Meal Reminders',
                  channelDescription: 'Daily 8:00 AM and 10:00 PM Meal Alarms',
                  importance: Importance.max,
                  priority: Priority.high,
                ),
              );

              // 8:00 AM Breakfast
              await localNotifs.zonedSchedule(
                101,
                'Breakfast Reminder (8:00 AM)',
                'Remember to update your meal selection for today!',
                _nextInstanceOfTime(8, 0),
                notifDetails,
                androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
                uiLocalNotificationDateInterpretation:
                    UILocalNotificationDateInterpretation.absoluteTime,
                matchDateTimeComponents: DateTimeComponents.time,
              );

              // 10:00 PM Tiffin
              await localNotifs.zonedSchedule(
                102,
                'Tiffin Reminder (10:00 PM)',
                'Confirm if you need tiffin packed for tomorrow!',
                _nextInstanceOfTime(22, 0),
                notifDetails,
                androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
                uiLocalNotificationDateInterpretation:
                    UILocalNotificationDateInterpretation.absoluteTime,
                matchDateTimeComponents: DateTimeComponents.time,
              );
            }

            tz.TZDateTime _nextInstanceOfTime(int hour, int minute) {
              final tz.TZDateTime now = tz.TZDateTime.now(tz.local);
              tz.TZDateTime scheduledDate =
                  tz.TZDateTime(tz.local, now.year, now.month, now.day, hour, minute);
              if (scheduledDate.isBefore(now)) {
                scheduledDate = scheduledDate.add(const Duration(days: 1));
              }
              return scheduledDate;
            }

            Future<void> _triggerTestNotification() async {
              const NotificationDetails notifDetails = NotificationDetails(
                android: AndroidNotificationDetails(
                  'test_channel',
                  'Test Notifications',
                  importance: Importance.max,
                  priority: Priority.high,
                ),
              );
              await localNotifs.show(
                999,
                'Meal Alert Test Active',
                'Notifications and scheduled meal reminders are working properly.',
                notifDetails,
              );
            }

            Future<void> _loadPersistedData() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final savedNames = prefs.getStringList('saved_member_names');
                final savedAvatarsRaw = prefs.getString('saved_member_avatars');
                final savedActiveUser = prefs.getString('saved_active_user');
                final rawDefaults = prefs.getString('saved_defaults');
                final rawExplicit = prefs.getString('saved_explicit');

                setState(() {
                  if (savedNames != null && savedNames.length == 4) {
                    memberNames = savedNames;
                  }
                  if (savedAvatarsRaw != null) {
                    memberAvatars = Map<String, String>.from(jsonDecode(savedAvatarsRaw));
                  }
                  if (savedActiveUser != null && memberNames.contains(savedActiveUser)) {
                    activeUser = savedActiveUser;
                  } else {
                    activeUser = memberNames.first;
                  }

                  if (rawDefaults != null) {
                    final Map<String, dynamic> decoded = jsonDecode(rawDefaults);
                    defaults = decoded.map((k, v) => MapEntry(k, Map<String, bool>.from(v)));
                  } else {
                    _initDefaults();
                  }
                  if (rawExplicit != null) {
                    explicitData = jsonDecode(rawExplicit);
                  }
                });
              } catch (_) {}
            }

            Future<void> _persistAll() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('saved_member_names', memberNames);
              await prefs.setString('saved_member_avatars', jsonEncode(memberAvatars));
              await prefs.setString('saved_active_user', activeUser);
              await prefs.setString('saved_defaults', jsonEncode(defaults));
              await prefs.setString('saved_explicit', jsonEncode(explicitData));
            }

            String get dateKey => DateFormat('yyyy-MM-dd').format(selectedDate);

            bool getEffectiveValue(String member, String meal) {
              if (explicitData.containsKey(dateKey) &&
                  explicitData[dateKey].containsKey(member) &&
                  explicitData[dateKey][member].containsKey(meal)) {
                return explicitData[dateKey][member][meal] as bool;
              }
              return defaults[member]?[meal] ?? false;
            }

            bool isExplicitlySet(String member, String meal) {
              return explicitData.containsKey(dateKey) &&
                  explicitData[dateKey].containsKey(member) &&
                  explicitData[dateKey][member].containsKey(meal);
            }

            void setSelection(String member, String meal, bool value) {
              if (member != activeUser) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text("Locked: You can only edit meals for $activeUser."),
                    duration: const Duration(seconds: 2),
                  ),
                );
                return;
              }
              setState(() {
                explicitData.putIfAbsent(dateKey, () => {});
                explicitData[dateKey].putIfAbsent(member, () => {});
                explicitData[dateKey][member][meal] = value;
              });
              _persistAll();
            }

            void _showActiveUserDialog() {
              showDialog(
                context: context,
                builder: (ctx) {
                  return AlertDialog(
                    title: const Text('Who is using this phone?'),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: memberNames.map((name) {
                        final avatar = memberAvatars[name] ?? '👤';
                        return ListTile(
                          leading: Text(avatar, style: const TextStyle(fontSize: 24)),
                          title: Text(name),
                          trailing: activeUser == name
                              ? const Icon(Icons.check_circle, color: Colors.indigo)
                              : null,
                          onTap: () {
                            setState(() => activeUser = name);
                            _persistAll();
                            Navigator.pop(ctx);
                          },
                        );
                      }).toList(),
                    ),
                  );
                },
              );
            }

            void _openFamilySettings() {
              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => FamilySettingsScreen(
                    currentNames: memberNames,
                    currentAvatars: memberAvatars,
                    defaults: defaults,
                    meals: meals,
                    onSave: (newNames, newAvatars, newDefaults) {
                      setState(() {
                        memberNames = newNames;
                        memberAvatars = newAvatars;
                        if (!memberNames.contains(activeUser)) {
                          activeUser = memberNames.first;
                        }
                        defaults = newDefaults;
                      });
                      _persistAll();
                    },
                    onTestNotification: _triggerTestNotification,
                  ),
                ),
              );
            }

            void shareToWhatsApp() async {
              final dateHeader = DateFormat('dd MMMM yyyy').format(selectedDate);
              StringBuffer sb = StringBuffer();
              sb.writeln("Family Meal Plan — $dateHeader\n");

              for (var meal in meals) {
                var yesList = memberNames.where((m) => getEffectiveValue(m, meal)).toList();
                String summary = yesList.length == memberNames.length
                    ? "Everyone"
                    : (yesList.isEmpty ? "None" : yesList.join(", "));
                sb.writeln("${meal.toUpperCase()}: ${yesList.length} Yes — $summary");
              }

              var declinedMembers = <String>[];
              for (var m in memberNames) {
                for (var meal in meals) {
                  if (isExplicitlySet(m, meal) && !getEffectiveValue(m, meal)) {
                    declinedMembers.add("$m ($meal)");
                  }
                }
              }
              if (declinedMembers.isNotEmpty) {
                sb.writeln("\nOpted Out (No): ${declinedMembers.join(', ')}");
              }

              final uri = Uri.parse("whatsapp://send?text=${Uri.encodeComponent(sb.toString())}");
              if (await canLaunchUrl(uri)) {
                await launchUrl(uri);
              }
            }

            @override
            Widget build(BuildContext context) {
              final activeAvatar = memberAvatars[activeUser] ?? '👤';

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Family Meal Planner'),
                  elevation: 2,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.people_alt_outlined),
                      tooltip: 'Manage Family & Defaults',
                      onPressed: _openFamilySettings,
                    ),
                    IconButton(
                      icon: const Icon(Icons.share),
                      tooltip: 'Share Plan',
                      onPressed: shareToWhatsApp,
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    // Active Profile Indicator & Switcher
                    Container(
                      color: Colors.indigo.shade50,
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(
                            children: [
                              Text(activeAvatar, style: const TextStyle(fontSize: 22)),
                              const SizedBox(width: 8),
                              Text(
                                "Profile: $activeUser",
                                style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Colors.indigo),
                              ),
                            ],
                          ),
                          OutlinedButton.icon(
                            style: OutlinedButton.styleFrom(
                              visualDensity: VisualDensity.compact,
                              side: const BorderSide(color: Colors.indigo),
                            ),
                            onPressed: _showActiveUserDialog,
                            icon: const Icon(Icons.sync, size: 16),
                            label: const Text("Switch"),
                          ),
                        ],
                      ),
                    ),

                    // Date Navigator
                    Container(
                      color: Colors.white,
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          IconButton(
                            icon: const Icon(Icons.chevron_left),
                            onPressed: () => setState(() => selectedDate =
                                selectedDate.subtract(const Duration(days: 1))),
                          ),
                          InkWell(
                            onTap: () async {
                              final picked = await showDatePicker(
                                context: context,
                                initialDate: selectedDate,
                                firstDate: DateTime.now().subtract(const Duration(days: 90)),
                                lastDate: DateTime.now().add(const Duration(days: 90)),
                              );
                              if (picked != null) setState(() => selectedDate = picked);
                            },
                            child: Row(
                              children: [
                                const Icon(Icons.calendar_today, size: 16, color: Colors.indigo),
                                const SizedBox(width: 8),
                                Text(
                                  DateFormat('EEE, d MMM yyyy').format(selectedDate),
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16),
                                ),
                              ],
                            ),
                          ),
                          IconButton(
                            icon: const Icon(Icons.chevron_right),
                            onPressed: () => setState(() =>
                                selectedDate = selectedDate.add(const Duration(days: 1))),
                          ),
                        ],
                      ),
                    ),
                    const Divider(height: 1),

                    // Meal List
                    Expanded(
                      child: ListView(
                        padding: const EdgeInsets.symmetric(vertical: 8),
                        children: meals.map((meal) {
                          int yesCount =
                              memberNames.where((m) => getEffectiveValue(m, meal)).length;
                          return Card(
                            margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                            elevation: 2,
                            child: ExpansionTile(
                              initiallyExpanded: true,
                              title: Text(
                                "$meal — $yesCount / ${memberNames.length} Yes",
                                style: const TextStyle(fontWeight: FontWeight.bold),
                              ),
                              children: memberNames.map((member) {
                                bool isYes = getEffectiveValue(member, meal);
                                bool isExplicit = isExplicitlySet(member, meal);
                                bool isMe = member == activeUser;
                                final avatar = memberAvatars[member] ?? '👤';

                                return ListTile(
                                  leading: CircleAvatar(
                                    backgroundColor: isMe ? Colors.indigo.shade100 : Colors.grey.shade200,
                                    child: Text(avatar, style: const TextStyle(fontSize: 20)),
                                  ),
                                  title: Row(
                                    children: [
                                      Text(member, style: const TextStyle(fontWeight: FontWeight.w600)),
                                      if (isMe)
                                        Container(
                                          margin: const EdgeInsets.only(left: 8),
                                          padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                          decoration: BoxDecoration(
                                            color: Colors.indigo.shade50,
                                            borderRadius: BorderRadius.circular(8),
                                            border: Border.all(color: Colors.indigo.shade200),
                                          ),
                                          child: const Text('You', style: TextStyle(fontSize: 10, color: Colors.indigo, fontWeight: FontWeight.bold)),
                                        ),
                                    ],
                                  ),
                                  subtitle: Text(
                                    isExplicit ? "Explicit Choice" : "Default Preference",
                                    style: TextStyle(
                                      fontSize: 12,
                                      color: isExplicit ? Colors.indigo : Colors.black54,
                                      fontWeight: isExplicit ? FontWeight.bold : FontWeight.normal,
                                    ),
                                  ),
                                  trailing: isMe
                                      ? Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            ChoiceChip(
                                              label: const Text("Yes"),
                                              selected: isYes,
                                              selectedColor: Colors.green.shade200,
                                              onSelected: (_) => setSelection(member, meal, true),
                                            ),
                                            const SizedBox(width: 8),
                                            ChoiceChip(
                                              label: const Text("No"),
                                              selected: !isYes,
                                              selectedColor: Colors.red.shade200,
                                              onSelected: (_) => setSelection(member, meal, false),
                                            ),
                                          ],
                                        )
                                      : Container(
                                          padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                          decoration: BoxDecoration(
                                            color: isYes ? Colors.green.shade50 : Colors.red.shade50,
                                            borderRadius: BorderRadius.circular(16),
                                            border: Border.all(color: isYes ? Colors.green.shade300 : Colors.red.shade300),
                                          ),
                                          child: Text(
                                            isYes ? "Yes" : "No",
                                            style: TextStyle(
                                              fontWeight: FontWeight.bold,
                                              fontSize: 12,
                                              color: isYes ? Colors.green.shade800 : Colors.red.shade800,
                                            ),
                                          ),
                                        ),
                                );
                              }).toList(),
                            ),
                          );
                        }).toList(),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class FamilySettingsScreen extends StatefulWidget {
            final List<String> currentNames;
            final Map<String, String> currentAvatars;
            final Map<String, Map<String, bool>> defaults;
            final List<String> meals;
            final Function(List<String>, Map<String, String>, Map<String, Map<String, bool>>) onSave;
            final Future<void> Function() onTestNotification;

            const FamilySettingsScreen({
              super.key,
              required this.currentNames,
              required this.currentAvatars,
              required this.defaults,
              required this.meals,
              required this.onSave,
              required this.onTestNotification,
            });

            @override
            State<FamilySettingsScreen> createState() => _FamilySettingsScreenState();
          }

          class _FamilySettingsScreenState extends State<FamilySettingsScreen> {
            late List<TextEditingController> _controllers;
            late List<String> _avatars;
            late Map<String, Map<String, bool>> _editableDefaults;

            final List<Map<String, String>> avatarChoices = [
              {'icon': '👨', 'label': 'Male'},
              {'icon': '👩', 'label': 'Female'},
              {'icon': '👦', 'label': 'Boy'},
              {'icon': '👧', 'label': 'Girl'},
            ];

            @override
            void initState() {
              super.initState();
              _controllers = widget.currentNames
                  .map((name) => TextEditingController(text: name))
                  .toList();
              _avatars = widget.currentNames
                  .map((name) => widget.currentAvatars[name] ?? '👤')
                  .toList();
              _editableDefaults = Map.from(widget.defaults);
            }

            void _saveSettings() {
              final newNames = _controllers.map((c) => c.text.trim().isEmpty ? 'Member' : c.text.trim()).toList();
              Map<String, String> updatedAvatars = {};
              Map<String, Map<String, bool>> updatedDefaults = {};

              for (int i = 0; i < newNames.length; i++) {
                final oldName = widget.currentNames[i];
                final newName = newNames[i];
                updatedAvatars[newName] = _avatars[i];
                updatedDefaults[newName] = _editableDefaults[oldName] ??
                    {'Breakfast': true, 'Tiffin': true, 'Lunch': true, 'Dinner': false};
              }

              widget.onSave(newNames, updatedAvatars, updatedDefaults);
              Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Family & Preferences'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.check),
                      tooltip: 'Save',
                      onPressed: _saveSettings,
                    ),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Card(
                      color: Colors.indigo.shade50,
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Notification Alarms', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                            const SizedBox(height: 4),
                            const Text('• 8:00 AM: Breakfast Reminder\n• 10:00 PM: Tiffin Reminder', style: TextStyle(fontSize: 13)),
                            const SizedBox(height: 8),
                            ElevatedButton.icon(
                              onPressed: () async {
                                await widget.onTestNotification();
                                if (context.mounted) {
                                  ScaffoldMessenger.of(context).showSnackBar(
                                    const SnackBar(content: Text('Test notification dispatched! Check your notification drawer.')),
                                  );
                                }
                              },
                              icon: const Icon(Icons.notifications_active),
                              label: const Text('Test Notification Now'),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 16),
                    const Text('Family Members (Names & Avatars)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                    const SizedBox(height: 8),
                    ...List.generate(4, (index) {
                      final currentName = widget.currentNames[index];
                      return Card(
                        margin: const EdgeInsets.symmetric(vertical: 8),
                        child: Padding(
                          padding: const EdgeInsets.all(12),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Row(
                                children: [
                                  CircleAvatar(
                                    backgroundColor: Colors.indigo.shade50,
                                    child: Text(_avatars[index], style: const TextStyle(fontSize: 22)),
                                  ),
                                  const SizedBox(width: 12),
                                  Expanded(
                                    child: TextField(
                                      controller: _controllers[index],
                                      decoration: InputDecoration(
                                        labelText: 'Member ${index + 1} Name',
                                        border: const OutlineInputBorder(),
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 10),
                              const Text('Select Profile Icon:', style: TextStyle(fontWeight: FontWeight.w600, fontSize: 13)),
                              const SizedBox(height: 4),
                              Row(
                                children: avatarChoices.map((choice) {
                                  final icon = choice['icon']!;
                                  final label = choice['label']!;
                                  final isSelected = _avatars[index] == icon;
                                  return Padding(
                                    padding: const EdgeInsets.only(right: 8.0),
                                    child: ChoiceChip(
                                      avatar: Text(icon),
                                      label: Text(label),
                                      selected: isSelected,
                                      selectedColor: Colors.indigo.shade100,
                                      onSelected: (val) {
                                        if (val) {
                                          setState(() => _avatars[index] = icon);
                                        }
                                      },
                                    ),
                                  );
                                }).toList(),
                              ),
                              const SizedBox(height: 10),
                              const Text('Default Preferences:', style: TextStyle(fontWeight: FontWeight.w600, fontSize: 13)),
                              Wrap(
                                spacing: 8,
                                children: widget.meals.map((meal) {
                                  final currentVal = _editableDefaults[currentName]?[meal] ?? true;
                                  return FilterChip(
                                    label: Text('$meal: ${currentVal ? "Yes" : "No"}'),
                                    selected: currentVal,
                                    onSelected: (val) {
                                      setState(() {
                                        _editableDefaults.putIfAbsent(currentName, () => {});
                                        _editableDefaults[currentName]![meal] = val;
                                      });
                                    },
                                  );
                                }).toList(),
                              ),
                            ],
                          ),
                        ),
                      );
                    }),
                    const SizedBox(height: 20),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(
                        backgroundColor: Colors.indigo,
                        foregroundColor: Colors.white,
                        minimumSize: const Size.fromHeight(48),
                      ),
                      onPressed: _saveSettings,
                      child: const Text('Save All Family Changes', style: TextStyle(fontSize: 16)),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Android APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMealPlanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Direct Release Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-${{ github.run_number }}
          name: Family Meal Planner v1.0.4 (${{ github.run_number }})
          files: build/app/outputs/flutter-apk/app-release.apk
